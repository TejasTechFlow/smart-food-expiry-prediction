<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Inventory · Smart Food Expiry</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body><aside class="sidebar" id="sidebar"></aside><main class="content"><button class="btn btn-light menu-btn mb-2" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
<div id="spinner" class="d-none position-fixed top-50 start-50 translate-middle" style="z-index:3000"><div class="spinner-border text-success" style="width:3rem;height:3rem"></div></div>
<div class="d-flex justify-content-between mb-3 flex-wrap gap-2"><h2>Food Inventory</h2><button class="btn btn-success" id="add"><i class="fa-solid fa-plus"></i> Add Food Item</button></div>
<div class="card p-3 mb-3"><div class="row g-2"><div class="col-md-4"><input id="q" class="form-control" placeholder="Search by food name"></div><div class="col-md-3"><select id="fc" class="form-select"><option value="">All categories</option></select></div>
<div class="col-md-3"><select id="fs" class="form-select"><option value="">All statuses</option><option>Fresh</option><option>Use Soon</option><option>Near Estimated Expiry</option><option>Estimated Shelf Life Exceeded</option></select></div>
<div class="col-md-2"><select id="so" class="form-select"><option value="expiry_asc">Expiry: soonest</option><option value="expiry_desc">Expiry: latest</option></select></div></div></div>
<div id="list" class="row g-3"></div>
<div class="modal fade" id="fm"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 id="fmt"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div id="fmform"></div></div><div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-success" id="fsave">Save</button></div></div></div></div>
<div class="footer">Estimates from an educational model trained on synthetic data. Not a food-safety judgement.</div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script>
<script src="js/inventory.js"></script></body></html>
