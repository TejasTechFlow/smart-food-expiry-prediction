<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>History · Smart Food Expiry</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body><aside class="sidebar" id="sidebar"></aside><main class="content"><button class="btn btn-light menu-btn mb-2" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
<div id="spinner" class="d-none position-fixed top-50 start-50 translate-middle" style="z-index:3000"><div class="spinner-border text-success" style="width:3rem;height:3rem"></div></div>
<div class="d-flex justify-content-between mb-3 flex-wrap gap-2"><h2>Prediction History</h2><button class="btn btn-outline-success" id="csv"><i class="fa-solid fa-file-csv"></i> Export CSV</button></div>
<div class="card p-3 mb-3"><div class="row g-2"><div class="col-md-3"><input id="q" class="form-control" placeholder="Search food name"></div><div class="col-md-2"><select id="fc" class="form-select"><option value="">All categories</option></select></div>
<div class="col-md-2"><input id="df" type="date" class="form-control" title="From"></div><div class="col-md-2"><input id="dt" type="date" class="form-control" title="To"></div>
<div class="col-md-3"><select id="so" class="form-select"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="shelf_asc">Shelf life: low to high</option><option value="shelf_desc">Shelf life: high to low</option></select></div></div></div>
<div class="card p-3"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Food</th><th>Category</th><th>Storage conditions</th><th>Remaining</th><th>Expiry</th><th>Predicted on</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="modal fade" id="dm"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 id="dmt"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="dmb"></div></div></div></div>
<div class="footer">Estimates from an educational model trained on synthetic data. Not a food-safety judgement.</div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script>
<script src="js/history.js"></script></body></html>
